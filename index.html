<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neumorphic Calculator</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e0e5ec">
</head>
<body>
<div class="calculator-container">
  <div class="display"><div id="previous-operand" class="previous-operand"></div><div id="current-operand" class="current-operand">0</div></div>
  <div class="buttons-grid">
    <button class="btn function" data-action="clear">AC</button><button class="btn function" data-action="delete">DEL</button><button class="btn operator" data-action="sqrt">√</button><button class="btn operator" data-action="pow">x²</button>
    <button class="btn operator" data-action="percent">%</button><button class="btn operator" data-operation="÷">÷</button><button class="btn operator" data-operation="×">×</button><button class="btn operator" data-operation="-">-</button>
    <button class="btn number" data-number="7">7</button><button class="btn number" data-number="8">8</button><button class="btn number" data-number="9">9</button><button class="btn operator" data-operation="+">+</button>
    <button class="btn number" data-number="4">4</button><button class="btn number" data-number="5">5</button><button class="btn number" data-number="6">6</button>
    <button class="btn number" data-number="1">1</button><button class="btn number" data-number="2">2</button><button class="btn number" data-number="3">3</button>
    <button class="btn number zero" data-number="0">0</button><button class="btn number" data-number=".">.</button><button class="btn equals" data-action="calculate">=</button>
  </div>
</div>
<script src="script.js"></script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./service-worker.js');}</script>
</body>
</html>
